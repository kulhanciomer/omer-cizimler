<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ömer Külhancı | Çizimler & Fikirler</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #f3f4f6;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .gallery-card {
            background: #121212;
            border: 1px solid #262626;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gallery-card:hover {
            transform: translateY(-4px);
            border-color: #e1bc83;
            box-shadow: 0 10px 30px -10px rgba(225, 188, 131, 0.15);
        }

        /* Lightbox Modal Animation */
        #lightbox {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #lightbox.hidden-lightbox {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        #lightbox.visible-lightbox {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 sm:px-8 flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-6xl flex flex-col items-center mb-12 text-center">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-[#e1bc83] to-[#9079b6] flex items-center justify-center mb-6 shadow-md">
            <span class="text-2xl font-serif text-[#111111] font-semibold tracking-tighter">ÖK</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-serif mb-4 text-[#e1bc83]">Çizimler & Fikirler</h1>
        <p class="text-gray-400 max-w-2xl text-base md:text-lg font-light leading-relaxed">
            Düşüncelerin kağıda döküldüğü, analitik ve sanatsal yaklaşımların kesiştiği çizimler ve görsel notlar.
        </p>
        <div class="flex items-center gap-4 mt-6">
            <a href="https://kulhanciomer.github.io/omerkulhanci/" class="text-xs md:text-sm text-[#9079b6] hover:text-[#e1bc83] transition-colors border-b border-transparent hover:border-[#e1bc83] pb-0.5">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Ana Sayfaya Dön
            </a>
            <span class="text-gray-600">•</span>
            <span id="item-count" class="text-xs md:text-sm text-gray-500">Yükleniyor...</span>
        </div>
    </header>

    <!-- Gallery Grid -->
    <main id="gallery-grid" class="w-full max-w-6xl grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
        <!-- Dynamic images inserted here -->
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="hidden-lightbox fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col items-center justify-between p-4 md:p-8">
        <!-- Close Button -->
        <button id="close-btn" class="absolute top-6 right-6 text-gray-400 hover:text-white text-3xl z-50 p-2 transition-colors focus:outline-none">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Main Content Area -->
        <div class="flex-grow w-full max-w-5xl flex items-center justify-between relative my-auto">
            <!-- Prev Button -->
            <button id="prev-btn" class="absolute left-2 md:left-4 z-40 text-gray-400 hover:text-[#e1bc83] text-2xl md:text-4xl p-3 bg-black/50 rounded-full backdrop-blur transition-all hover:scale-110 focus:outline-none">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <!-- Image Wrapper -->
            <div class="w-full h-full flex items-center justify-center p-4">
                <img id="lightbox-img" src="" alt="" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl border border-white/10 transition-all duration-300">
            </div>

            <!-- Next Button -->
            <button id="next-btn" class="absolute right-2 md:right-4 z-40 text-gray-400 hover:text-[#e1bc83] text-2xl md:text-4xl p-3 bg-black/50 rounded-full backdrop-blur transition-all hover:scale-110 focus:outline-none">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- Counter / Caption Footer -->
        <div class="w-full max-w-xl text-center mt-4">
            <p id="lightbox-counter" class="text-xs text-[#e1bc83] font-mono mb-1"></p>
            <p id="lightbox-title" class="text-sm text-gray-300 font-light"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-20 border-t border-[#262626] pt-8 w-full max-w-6xl text-center text-gray-500 text-xs md:text-sm">
        © 2026 Ömer Külhancı. Tüm hakları saklıdır.
    </footer>

            "assets/images/posts/202410/464213033_1907651406313072_688069066690305561_n_18136863670362033.webp",
            "assets/images/posts/202503/486875326_17974318100835257_2340418759341664998_n_17883025593252583.jpg",
            "assets/images/posts/202504/491112279_17976554339835257_625502021852746649_n_18267116224278813.webp",
            "assets/images/posts/202504/491438156_17976859655835257_1690503975163706226_n_18385906786114910.webp",
            "assets/images/posts/202505/495455940_17978529116835257_5388631315992144260_n_18109691737500462.webp"
        ];

        let currentIndex = 0;

        const galleryGrid = document.getElementById('gallery-grid');
        const itemCount = document.getElementById('item-count');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const lightboxTitle = document.getElementById('lightbox-title');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const closeBtn = document.getElementById('close-btn');

        // Populate Counter
        itemCount.innerText = `${imageList.length} Çizim / Eser`;

        // Render Grid Items
        imageList.forEach((path, index) => {
            const card = document.createElement('div');
            card.className = 'gallery-card rounded-xl overflow-hidden cursor-pointer flex flex-col group';
            card.onclick = () => openLightbox(index);

            card.innerHTML = `
                <div class="aspect-square w-full bg-[#161616] overflow-hidden relative">
                    <img src="${path}" alt="Çizim ${index + 1}" loading="lazy" class="w-full h-full object-cover opacity-85 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
                        <span class="text-xs text-[#e1bc83] font-serif"><i class="fa-solid fa-expand mr-1"></i> Büyüt</span>
                    </div>
                </div>
            `;
            galleryGrid.appendChild(card);
        });

        // Lightbox Functions
        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.remove('hidden-lightbox');
            lightbox.classList.add('visible-lightbox');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('visible-lightbox');
            lightbox.classList.add('hidden-lightbox');
            document.body.style.overflow = 'auto';
        }

        function updateLightbox() {
            lightboxImg.src = imageList[currentIndex];
            lightboxCounter.innerText = `${currentIndex + 1} / ${imageList.length}`;
            lightboxTitle.innerText = `Ömer Külhancı Çizim Arşivi #${currentIndex + 1}`;
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
            updateLightbox();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % imageList.length;
            updateLightbox();
        }

        // Event Listeners
        prevBtn.onclick = (e) => { e.stopPropagation(); prevImage(); };
        nextBtn.onclick = (e) => { e.stopPropagation(); nextImage(); };
        closeBtn.onclick = closeLightbox;

        lightbox.onclick = (e) => {
            if (e.target === lightbox || e.target.id === 'lightbox-img-container') {
                closeLightbox();
            }
        };

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('visible-lightbox')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        });
    </script>
</body>
</html>
