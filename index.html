<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ömer Külhancı | Çizimler & Fikirler</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #f3f4f6;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .gallery-card {
            background: #121212;
            border: 1px solid #262626;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gallery-card:hover {
            transform: translateY(-4px);
            border-color: #e1bc83;
            box-shadow: 0 10px 30px -10px rgba(225, 188, 131, 0.15);
        }

        #lightbox {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #lightbox.hidden-lightbox {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        #lightbox.visible-lightbox {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 sm:px-8 flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-6xl flex flex-col items-center mb-12 text-center">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-[#e1bc83] to-[#9079b6] flex items-center justify-center mb-5 shadow-md">
            <span class="text-2xl font-serif text-[#111111] font-semibold tracking-tighter">ÖK</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-serif mb-3 text-[#e1bc83]">Çizimler & Fikirler</h1>
        <p class="text-gray-400 max-w-xl text-base md:text-lg font-light leading-relaxed">
            Kavramlar, karalamalar ve görsel notlar.
        </p>
        <span id="drawing-count" class="mt-4 text-xs md:text-sm text-gray-500 font-mono">Yükleniyor...</span>
    </header>

    <!-- Main Drawings Gallery Grid -->
    <main id="gallery-grid" class="w-full max-w-6xl grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 mb-16">
        <!-- Dynamic drawing images inserted here -->
    </main>

    <!-- Separate Photos Section (Bottom Collapsible) -->
    <section class="w-full max-w-6xl border-t border-[#262626] pt-12 flex flex-col items-center">
        <button id="toggle-photos-btn" class="px-6 py-3 bg-[#171717] hover:bg-[#222222] border border-[#262626] hover:border-[#e1bc83] text-[#e1bc83] text-sm font-medium rounded-full transition-all flex items-center gap-2 focus:outline-none shadow-md">
            <i class="fa-regular fa-image"></i>
            <span>Fotoğrafları Göster</span>
            <i id="toggle-icon" class="fa-solid fa-chevron-down ml-1 text-xs"></i>
        </button>

        <div id="photos-container" class="hidden w-full mt-8">
            <h2 class="text-center text-lg font-serif text-gray-300 mb-6">Fotoğraflar</h2>
            <div id="photos-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Dynamic photos inserted here -->
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="hidden-lightbox fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col items-center justify-between p-4 md:p-8">
        <button id="close-btn" class="absolute top-6 right-6 text-gray-400 hover:text-white text-3xl z-50 p-2 transition-colors focus:outline-none">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="flex-grow w-full max-w-5xl flex items-center justify-between relative my-auto">
            <button id="prev-btn" class="absolute left-2 md:left-4 z-40 text-gray-400 hover:text-[#e1bc83] text-2xl md:text-4xl p-3 bg-black/50 rounded-full backdrop-blur transition-all hover:scale-110 focus:outline-none">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="w-full h-full flex items-center justify-center p-4">
                <img id="lightbox-img" src="" alt="" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl border border-white/10 transition-all duration-300">
            </div>

            <button id="next-btn" class="absolute right-2 md:right-4 z-40 text-gray-400 hover:text-[#e1bc83] text-2xl md:text-4xl p-3 bg-black/50 rounded-full backdrop-blur transition-all hover:scale-110 focus:outline-none">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="w-full max-w-xl text-center mt-4">
            <p id="lightbox-counter" class="text-xs text-[#e1bc83] font-mono mb-1"></p>
            <p id="lightbox-title" class="text-sm text-gray-300 font-light"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-20 border-t border-[#262626] pt-8 w-full max-w-6xl text-center text-gray-500 text-xs md:text-sm">
        © 2026 Ömer Külhancı. Tüm hakları saklıdır.
    </footer>

    <!-- Scripts -->

            "assets/images/posts/202404/18046620064629262.webp",
            "assets/images/posts/202407/18016566185379420.webp"
];
        const photoList = [
            "assets/images/posts/17880326874513014.jpg",
            "assets/images/posts/17887721037521191.jpg"
];

        let currentList = [];
        let currentIndex = 0;

        const galleryGrid = document.getElementById('gallery-grid');
        const drawingCount = document.getElementById('drawing-count');
        const togglePhotosBtn = document.getElementById('toggle-photos-btn');
        const photosContainer = document.getElementById('photos-container');
        const photosGrid = document.getElementById('photos-grid');
        const toggleIcon = document.getElementById('toggle-icon');

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const lightboxTitle = document.getElementById('lightbox-title');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const closeBtn = document.getElementById('close-btn');

        // Shuffle array randomly
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Render Gallery
        function renderGalleries() {
            // Randomize drawing order on each visit/reload
            shuffleArray(drawingList);

            drawingCount.innerText = `${drawingList.length} Çizim & Karalama`;

            // Drawings
            galleryGrid.innerHTML = '';
            drawingList.forEach((path, index) => {
                const card = createCard(path, () => openLightbox(drawingList, index, 'Çizim'));
                galleryGrid.appendChild(card);
            });

            // Photos
            photosGrid.innerHTML = '';
            photoList.forEach((path, index) => {
                const card = createCard(path, () => openLightbox(photoList, index, 'Fotoğraf'));
                photosGrid.appendChild(card);
            });

            if (photoList.length === 0) {
                togglePhotosBtn.style.display = 'none';
            } else {
                togglePhotosBtn.querySelector('span').innerText = `Kişisel Fotoğraflar (${photoList.length})`;
            }
        }

        function createCard(path, onClick) {
            const card = document.createElement('div');
            card.className = 'gallery-card rounded-xl overflow-hidden cursor-pointer flex flex-col group';
            card.onclick = onClick;
            card.innerHTML = `
                <div class="aspect-square w-full bg-[#161616] overflow-hidden relative">
                    <img src="${path}" alt="Görsel" loading="lazy" class="w-full h-full object-cover opacity-85 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
                        <span class="text-xs text-[#e1bc83] font-serif"><i class="fa-solid fa-expand mr-1"></i> Büyüt</span>
                    </div>
                </div>
            `;
            return card;
        }

        // Toggle Photos
        togglePhotosBtn.onclick = () => {
            const isHidden = photosContainer.classList.contains('hidden');
            if (isHidden) {
                photosContainer.classList.remove('hidden');
                toggleIcon.className = 'fa-solid fa-chevron-up ml-1 text-xs';
            } else {
                photosContainer.classList.add('hidden');
                toggleIcon.className = 'fa-solid fa-chevron-down ml-1 text-xs';
            }
        };

        // Lightbox Logic
        function openLightbox(list, index, label) {
            currentList = list;
            currentIndex = index;
            currentLabel = label;
            updateLightbox();
            lightbox.classList.remove('hidden-lightbox');
            lightbox.classList.add('visible-lightbox');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('visible-lightbox');
            lightbox.classList.add('hidden-lightbox');
            document.body.style.overflow = 'auto';
        }

        function updateLightbox() {
            lightboxImg.src = currentList[currentIndex];
            lightboxCounter.innerText = `${currentIndex + 1} / ${currentList.length}`;
            lightboxTitle.innerText = `Ömer Külhancı Arşivi (${currentLabel} #${currentIndex + 1})`;
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
            updateLightbox();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % currentList.length;
            updateLightbox();
        }

        prevBtn.onclick = (e) => { e.stopPropagation(); prevImage(); };
        nextBtn.onclick = (e) => { e.stopPropagation(); nextImage(); };
        closeBtn.onclick = closeLightbox;

        lightbox.onclick = (e) => {
            if (e.target === lightbox) closeLightbox();
        };

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('visible-lightbox')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        });

        // Initialize Galleries
        renderGalleries();
    </script>
</body>
</html>
